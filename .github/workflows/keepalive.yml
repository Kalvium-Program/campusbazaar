name: Keep API awake
# Render's free plan sleeps after ~15 minutes idle. A ping every 10 minutes keeps it (and Neon) warm.
on:
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 10 --max-time 60 https://campusbazaar-api.onrender.com/api/health
