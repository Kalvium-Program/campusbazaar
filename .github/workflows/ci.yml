name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: campus, POSTGRES_PASSWORD: campus, POSTGRES_DB: campusbazaar_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campus" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://campus:campus@localhost:5432/campusbazaar_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      WEB_ORIGIN: http://localhost:3000
      NODE_ENV: test
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    needs: [api, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: campus, POSTGRES_PASSWORD: campus, POSTGRES_DB: campusbazaar }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campus" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://campus:campus@localhost:5432/campusbazaar
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      WEB_ORIGIN: http://localhost:3000
      API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000/ws
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Start the API
        working-directory: api
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          SEED_PASSWORD=campus123 npm run db:seed
          npm run build
          nohup node dist/server.js > ../api.log 2>&1 &
      - name: Start the web app
        working-directory: web
        run: |
          npm ci
          npm run build
          nohup npm start > ../web.log 2>&1 &
      - name: Wait for both
        run: npx --yes wait-on http://localhost:4000/api/health http://localhost:3000 -t 60000
      - name: Browser tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: logs, path: "*.log\nweb/test-results" }
