# Render Blueprint: the API and the web app. The database is on Neon (see README).
services:
  - type: web
    name: campusbazaar-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: WEB_ORIGIN, sync: false }
      - { key: AI_PROVIDER, value: fake }

  - type: web
    name: campusbazaar-web
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    plan: free
    envVars:
      - { key: API_URL, value: "https://campusbazaar-api.onrender.com" }
      - { key: NEXT_PUBLIC_WS_URL, value: "wss://campusbazaar-api.onrender.com/ws" }
