# One command starts everything: docker compose up --build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campusbazaar
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campusbazaar"]
      interval: 3s
      retries: 10
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://campus:campus@db:5432/campusbazaar
      JWT_SECRET: local-compose-secret-local-compose-secret
      WEB_ORIGIN: http://localhost:3000
      NODE_ENV: production
      AI_PROVIDER: fake
    depends_on: { db: { condition: service_healthy } }
    ports: ["4000:4000"]
  web:
    build:
      context: ./web
      args: { API_URL: http://api:4000 }
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000/ws
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  dbdata:
